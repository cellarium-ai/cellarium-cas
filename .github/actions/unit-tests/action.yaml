name: Unit tests and linting
description: Run unit tests in different python environments
inputs:
  python-version:
    required: true
    description: "Python version to run the tests"
runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Dev Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt
      shell: bash

    - name: Run linting
      # Run tox using the version of Python in `PATH`
      # Only run on Python 3.12 to avoid duplicate lint failures across the matrix
      if: ${{ inputs.python-version == '3.12' }}
      run: tox -e lint
      shell: bash

    - name: Should run doc build
      run: |
        import os
        from packaging.version import Version
        with open(os.getenv("GITHUB_ENV"), "a") as file_env:
          python_version = Version("${{ inputs.python-version }}")
          min_python_version = Version("3.10")
          if python_version < min_python_version:
            file_env.write(f"DO_DOC_BUILD=false\n")
          else:
            file_env.write(f"DO_DOC_BUILD=true\n")
      shell: python
    - name: Run doc build
      # Run tox using the version of Python in `PATH`
      if: ${{ env.DO_DOC_BUILD == 'true' }}
      run: tox -e docs
      shell: bash

    - name: Compute py3.10 ignore list for pip-audit
      # pillow (fixed in 13.0.0), filelock (4.2.1) and tornado (6.6) advisories
      # need Python >=3.11. Only 3.10 resolves the vulnerable releases here, so
      # scope the ignore to 3.10 and keep 3.11/3.12 strict.
      run: |
        if [ "${{ inputs.python-version }}" = "3.10" ]; then
          {
            echo "PILLOW_IGNORES<<EOF"
            echo "CVE-2026-112390"
            echo "CVE-2026-112391"
            echo "CVE-2026-112393"
            echo "CVE-2026-112395"
            echo "CVE-2026-112397"
            echo "CVE-2026-112399"
            echo "CVE-2026-112400"
            echo "CVE-2026-112401"
            echo "CVE-2026-112404"
            echo "CVE-2026-112406"
            echo "CVE-2026-112891"
            echo "CVE-2026-112892"
            echo "CVE-2026-112893"
            echo "CVE-2026-112894"
            echo "CVE-2026-112895"
            echo "CVE-2026-112896"
            echo "CVE-2026-112897"
            echo "CVE-2026-112899"
            echo "CVE-2026-112900"
            echo "CVE-2026-112906"
            echo "CVE-2026-112907"
            echo "CVE-2026-112908"
            echo "CVE-2026-112909"
            echo "CVE-2026-112910"
            echo "CVE-2026-112911"
            echo "CVE-2026-112912"
            echo "CVE-2026-112913"
            echo "CVE-2026-112914"
            echo "CVE-2026-112915"
            echo "CVE-2026-112934"
            echo "CVE-2026-112935"
            echo "CVE-2026-112937"
            echo "CVE-2026-112938"
            echo "CVE-2026-112939"
            echo "CVE-2026-112940"
            echo "CVE-2026-112941"
            echo "CVE-2026-115927"
            echo "CVE-2026-116577"
            echo "CVE-2026-116578"
            echo "CVE-2026-96638"
            echo "CVE-2026-96640"
            echo "CVE-2026-96778"
            echo "PYSEC-2026-4326"
            echo "PYSEC-2026-4327"
            echo "PYSEC-2026-4328"
            echo "PYSEC-2026-4330"
            echo "PYSEC-2026-4331"
            echo "PYSEC-2026-4332"
            echo "PYSEC-2026-4333"
            echo "PYSEC-2026-4335"
            echo "PYSEC-2026-4336"
            echo "PYSEC-2026-4337"
            echo "PYSEC-2026-4338"
            echo "PYSEC-2026-4339"
            echo "PYSEC-2026-4340"
            echo "PYSEC-2026-4341"
            echo "PYSEC-2026-4342"
            echo "PYSEC-2026-4343"
            echo "EOF"
          } >> "$GITHUB_ENV"
        else
          echo "PILLOW_IGNORES=" >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Run pip-audit command through GHA
      # Check dependencies for security vulnerabilities.
      # Only run on a single python version (the one that does doc builds)
      # CVE-2026-25645 (requests): fix version 2.33.0 not yet released.
      # CVE-2026-27205 (flask) and CVE-2025-66221, CVE-2026-21860, CVE-2026-27199,
      #   PYSEC-2026-4312 (werkzeug):
      #   cannot be fixed until dash drops its Flask<3.1 constraint (currently dash==2.17.1).
      if: ${{ env.DO_DOC_BUILD == 'true' }}
      uses: pypa/gh-action-pip-audit@v1.0.8
      with:
        ignore-vulns: |
          CVE-2026-25645
          CVE-2026-27205
          CVE-2025-66221
          CVE-2026-21860
          CVE-2026-27199
          PYSEC-2026-4312
          ${{ env.PILLOW_IGNORES }}
        inputs: |
          requirements/base.txt
          requirements/dev.txt
          requirements/docs.txt
          requirements/test.txt
          requirements/vis.txt

    - name: Run unit tests
      # Run tox using the version of Python in `PATH`
      run: tox -e unit
      shell: bash